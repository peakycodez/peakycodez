<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <radialGradient id="emberBg" cx="50%" cy="100%" r="90%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#E52525" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="edgeBleed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="50%" stop-color="#FF5A1F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <filter id="emberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="120" fill="#080808" />
  <rect width="1000" height="120" fill="url(#emberBg)" />
  <line x1="50" y1="118" x2="950" y2="118" stroke="url(#edgeBleed)" stroke-width="1.2" />

  <!-- Animated Ember Particles Rising -->
  <g filter="url(#emberGlow)">
    <!-- Particle 1 -->
    <circle cx="120" cy="110" r="1.5" fill="#FF5A1F">
      <animate attributeName="cy" values="115;20;115" dur="6.2s" repeatCount="indefinite" />
      <animate attributeName="cx" values="120;135;120" dur="6.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="6.2s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 2 -->
    <circle cx="240" cy="100" r="2.2" fill="#FFB347">
      <animate attributeName="cy" values="110;15;110" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="240;225;240" dur="5.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 3 -->
    <circle cx="360" cy="110" r="1.8" fill="#E52525">
      <animate attributeName="cy" values="115;30;115" dur="7.1s" repeatCount="indefinite" />
      <animate attributeName="cx" values="360;375;360" dur="7.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7.1s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 4 -->
    <circle cx="480" cy="95" r="2.5" fill="#FF7518">
      <animate attributeName="cy" values="105;10;105" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="480;495;480" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.8s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 5 -->
    <circle cx="580" cy="105" r="1.2" fill="#FFB347">
      <animate attributeName="cy" values="112;25;112" dur="6.8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="580;565;580" dur="6.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="6.8s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 6 -->
    <circle cx="700" cy="110" r="2" fill="#FF5A1F">
      <animate attributeName="cy" values="118;20;118" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="cx" values="700;715;700" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.2s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 7 -->
    <circle cx="820" cy="100" r="1.6" fill="#E52525">
      <animate attributeName="cy" values="108;15;108" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="820;805;820" dur="6.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.5s" repeatCount="indefinite" />
    </circle>

    <!-- Particle 8 -->
    <circle cx="910" cy="105" r="2.2" fill="#FF7518">
      <animate attributeName="cy" values="114;25;114" dur="5.8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="910;925;910" dur="5.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.8s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>