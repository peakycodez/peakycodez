<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <radialGradient id="footerCoreGlow" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E52525" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="25%" stop-color="#801414" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="75%" stop-color="#801414" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <linearGradient id="footerWordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F5F5" />
      <stop offset="60%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#FF5A1F" />
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="180" rx="16" fill="#080808" />
  <rect width="1200" height="180" rx="16" fill="url(#footerCoreGlow)" />
  <rect x="1" y="1" width="1198" height="178" rx="15" fill="none" stroke="#200C0C" stroke-width="1.2" />

  <!-- Top Horizon Beam -->
  <line x1="50" y1="2" x2="1150" y2="2" stroke="url(#footerLineGrad)" stroke-width="2" />

  <!-- Central Molten Fox Micro-Mark (Centred at x=600, y=55) -->
  <g transform="translate(580, 22)">
    <!-- Micro Ear Left -->
    <polygon points="20,16 9,18 2,4" fill="#FF5A1F" />
    <!-- Micro Ear Right -->
    <polygon points="20,16 31,18 38,4" fill="#FF5A1F" />
    <!-- Micro Forehead -->
    <polygon points="20,12 14,20 20,28 26,20" fill="#FF7518" />
    <!-- Micro Cheeks -->
    <polygon points="9,18 0,26 14,30 14,20" fill="#801414" />
    <polygon points="31,18 40,26 26,30 26,20" fill="#801414" />
    <!-- Micro Snout -->
    <polygon points="14,30 20,44 26,30 20,28" fill="#FFB347" />
    <!-- Micro Eyes -->
    <circle cx="15" cy="22" r="1.5" fill="#FFFFFF" />
    <circle cx="25" cy="22" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Wordmark -->
  <text x="600" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-weight="900" font-size="20" letter-spacing="8" fill="url(#footerWordmarkGrad)">
    PEAKYCODEZ
  </text>

  <!-- Tagline & Architecture Details -->
  <text x="600" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="#FF5A1F">
    ENGINEERED DIFFERENT.
  </text>

  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="500" letter-spacing="2" fill="#71717A">
    SAIRAJ VISHNU PINGALE // B.TECH AI &amp; DATA SCIENCE // INFERNAL SIGNATURE
  </text>

  <!-- Corner Brackets -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#FF5A1F" stroke-width="1.8" />
  <path d="M 1184 30 L 1184 16 L 1170 16" fill="none" stroke="#FF5A1F" stroke-width="1.8" />
  <path d="M 16 150 L 16 164 L 30 164" fill="none" stroke="#FF5A1F" stroke-width="1.8" />
  <path d="M 1184 150 L 1184 164 L 1170 164" fill="none" stroke="#FF5A1F" stroke-width="1.8" />
</svg>