<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#E52525" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Facets -->
    <linearGradient id="facetEarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7518" />
      <stop offset="60%" stop-color="#E52525" />
      <stop offset="100%" stop-color="#2A0808" />
    </linearGradient>

    <linearGradient id="facetEarRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7518" />
      <stop offset="60%" stop-color="#E52525" />
      <stop offset="100%" stop-color="#2A0808" />
    </linearGradient>

    <linearGradient id="facetEarInnerLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#E52525" />
    </linearGradient>

    <linearGradient id="facetEarInnerRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#E52525" />
    </linearGradient>

    <linearGradient id="facetCrownLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#801010" />
    </linearGradient>

    <linearGradient id="facetCrownRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#801010" />
    </linearGradient>

    <linearGradient id="facetForeheadCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF7518" />
      <stop offset="70%" stop-color="#C01818" />
      <stop offset="100%" stop-color="#3A0808" />
    </linearGradient>

    <linearGradient id="facetCheekOuterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#8B1414" />
      <stop offset="100%" stop-color="#180505" />
    </linearGradient>

    <linearGradient id="facetCheekOuterRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#8B1414" />
      <stop offset="100%" stop-color="#180505" />
    </linearGradient>

    <linearGradient id="facetMuzzleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7518" />
      <stop offset="100%" stop-color="#E52525" />
    </linearGradient>

    <linearGradient id="facetMuzzleRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7518" />
      <stop offset="100%" stop-color="#E52525" />
    </linearGradient>

    <linearGradient id="moltenCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#E52525" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="infernalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="500" height="500" rx="24" fill="#080808" />
  <circle cx="250" cy="230" r="220" fill="url(#bgGlow)" />

  <!-- Subtle Outer Hex Shield Outline -->
  <polygon points="250,30 420,125 420,335 250,430 80,335 80,125"
           fill="none" stroke="#251212" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Geometric Ember Particles -->
  <g opacity="0.75">
    <polygon points="120,180 123,175 126,180 123,185" fill="#FF5A1F">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite" />
    </polygon>
    <polygon points="380,170 383,165 386,170 383,175" fill="#FFB347">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite" />
    </polygon>
    <polygon points="160,95 162,91 164,95 162,99" fill="#E52525">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.8s" repeatCount="indefinite" />
    </polygon>
    <polygon points="340,90 342,86 344,90 342,94" fill="#FF7518">
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.1s" repeatCount="indefinite" />
    </polygon>
    <polygon points="250,455 252,450 254,455 252,460" fill="#FF5A1F">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- GEOMETRIC FOX EMBLEM -->
  <g id="geometricFox" filter="url(#infernalGlow)">
    <!-- OUTER EARS -->
    <!-- Left Outer Ear -->
    <polygon points="250,140 180,150 145,55" fill="url(#facetEarLeft)" stroke="#E52525" stroke-width="0.75" />
    <!-- Right Outer Ear -->
    <polygon points="250,140 320,150 355,55" fill="url(#facetEarRight)" stroke="#E52525" stroke-width="0.75" />

    <!-- INNER EARS -->
    <!-- Left Inner Ear Cavity -->
    <polygon points="195,145 155,75 180,150" fill="url(#facetEarInnerLeft)" opacity="0.95" />
    <!-- Right Inner Ear Cavity -->
    <polygon points="305,145 345,75 320,150" fill="url(#facetEarInnerRight)" opacity="0.95" />

    <!-- FOREHEAD / CROWN -->
    <!-- Center Forehead Rhombus -->
    <polygon points="250,110 215,160 250,210 285,160" fill="url(#facetForeheadCenter)" stroke="#FF5A1F" stroke-width="0.75" />
    <!-- Left Forehead Plate -->
    <polygon points="250,110 180,150 215,160" fill="url(#facetCrownLeft)" stroke="#FF5A1F" stroke-width="0.5" />
    <!-- Right Forehead Plate -->
    <polygon points="250,110 320,150 285,160" fill="url(#facetCrownRight)" stroke="#FF5A1F" stroke-width="0.5" />

    <!-- TEMPLE / UPPER CHEEKS -->
    <!-- Left Temple -->
    <polygon points="180,150 130,225 210,215 215,160" fill="url(#facetCheekOuterLeft)" stroke="#E52525" stroke-width="0.5" />
    <!-- Right Temple -->
    <polygon points="320,150 370,225 290,215 285,160" fill="url(#facetCheekOuterRight)" stroke="#E52525" stroke-width="0.5" />

    <!-- CHEEK FLANKS (SHARP JAW ANGLES) -->
    <!-- Left Lower Cheek Flare -->
    <polygon points="130,225 90,265 185,275 210,215" fill="#200606" stroke="#FF5A1F" stroke-width="0.75" />
    <!-- Right Lower Cheek Flare -->
    <polygon points="370,225 410,265 315,275 290,215" fill="#200606" stroke="#FF5A1F" stroke-width="0.75" />

    <!-- MID-FACE & NOSE BRIDGE -->
    <!-- Bridge Left -->
    <polygon points="250,210 210,215 220,285 250,310" fill="#6A1010" stroke="#FF7518" stroke-width="0.5" />
    <!-- Bridge Right -->
    <polygon points="250,210 290,215 280,285 250,310" fill="#450A0A" stroke="#FF7518" stroke-width="0.5" />

    <!-- CHEEK INNERS -->
    <!-- Left Inner Cheek -->
    <polygon points="210,215 185,275 220,285" fill="#8C1616" stroke="#FF5A1F" stroke-width="0.5" />
    <!-- Right Inner Cheek -->
    <polygon points="290,215 315,275 280,285" fill="#5E0F0F" stroke="#FF5A1F" stroke-width="0.5" />

    <!-- LOWER JAW & SNOUT -->
    <!-- Left Muzzle -->
    <polygon points="220,285 185,275 215,345 250,380 250,310" fill="url(#facetMuzzleLeft)" stroke="#FF7518" stroke-width="0.75" />
    <!-- Right Muzzle -->
    <polygon points="280,285 315,275 285,345 250,380 250,310" fill="url(#facetMuzzleRight)" stroke="#FF7518" stroke-width="0.75" />

    <!-- CHIN TIP -->
    <polygon points="250,310 235,360 250,390 265,360" fill="url(#moltenCore)" />

    <!-- PIERCING MOLTEN EYES -->
    <!-- Left Eye -->
    <polygon points="195,210 230,222 205,228 175,220" fill="#FFB347" filter="url(#eyeGlow)">
      <animate attributeName="fill" values="#FFB347;#FF5A1F;#FFB347" dur="2.5s" repeatCount="indefinite" />
    </polygon>
    <!-- Right Eye -->
    <polygon points="305,210 270,222 295,228 325,220" fill="#FFB347" filter="url(#eyeGlow)">
      <animate attributeName="fill" values="#FFB347;#FF5A1F;#FFB347" dur="2.5s" repeatCount="indefinite" />
    </polygon>

    <!-- Eye Pupil Accent Cut -->
    <polygon points="205,217 220,223 210,225" fill="#FFFFFF" opacity="0.9" />
    <polygon points="295,217 280,223 290,225" fill="#FFFFFF" opacity="0.9" />

    <!-- NOSE APEX -->
    <polygon points="250,360 242,372 258,372" fill="#120404" stroke="#FF5A1F" stroke-width="0.5" />
  </g>

  <!-- BRAND WORDMARK & SIGNATURE -->
  <text x="250" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="8" fill="#F5F5F5">
    PEAKYCODEZ
  </text>
  <text x="250" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" letter-spacing="4" fill="#FF5A1F">
    ENGINEERED DIFFERENT.
  </text>
</svg>