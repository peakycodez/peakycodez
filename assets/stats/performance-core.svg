<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%">
  <defs>
    <radialGradient id="perfGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#E52525" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="perfTopBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1010" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#3A1010" />
    </linearGradient>
  </defs>

  <!-- Frame Surface -->
  <rect width="495" height="195" rx="10" fill="#080808" />
  <rect width="495" height="195" rx="10" fill="url(#perfGlow)" />
  <rect x="1" y="1" width="493" height="193" rx="9" fill="none" stroke="#221010" stroke-width="1.2" />
  <line x1="20" y1="2" x2="475" y2="2" stroke="url(#perfTopBorder)" stroke-width="1.8" />

  <!-- Corner Brackets -->
  <path d="M 10 24 L 10 10 L 24 10" fill="none" stroke="#FF5A1F" stroke-width="1.5" />
  <path d="M 485 24 L 485 10 L 471 10" fill="none" stroke="#FF5A1F" stroke-width="1.5" />
  <path d="M 10 171 L 10 185 L 24 185" fill="none" stroke="#FF5A1F" stroke-width="1.5" />
  <path d="M 485 171 L 485 185 L 471 185" fill="none" stroke="#FF5A1F" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 30)">
    <circle cx="6" cy="6" r="3.5" fill="#FF5A1F">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#FF7518">
      PERFORMANCE TELEMETRY
    </text>
    <text x="445" y="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="600" letter-spacing="1" fill="#71717A">
      GITHUB // CORE
    </text>
  </g>

  <!-- Divider -->
  <line x1="25" y1="52" x2="470" y2="52" stroke="#200B0B" stroke-width="1" />

  <!-- Stat Items -->
  <g transform="translate(30, 68)">
    <!-- Item 1: Total Stars Earned -->
    <g transform="translate(0, 0)">
      <polygon points="10,0 12,6 18,7 13,11 15,17 10,13 5,17 7,11 2,7 8,6" fill="#FFB347" />
      <text x="28" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">
        Total Stars Earned:
      </text>
      <text x="435" y="13" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#F5F5F5">
        Active Tracking
      </text>
    </g>

    <!-- Item 2: Production Commits -->
    <g transform="translate(0, 28)">
      <circle cx="10" cy="10" r="5" fill="none" stroke="#FF5A1F" stroke-width="1.5" />
      <circle cx="10" cy="10" r="2" fill="#FF5A1F" />
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">
        Production Commits:
      </text>
      <text x="435" y="14" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#F5F5F5">
        Continuous Push
      </text>
    </g>

    <!-- Item 3: Active Repositories -->
    <g transform="translate(0, 56)">
      <rect x="5" y="4" width="10" height="12" rx="2" fill="none" stroke="#E52525" stroke-width="1.5" />
      <line x1="8" y1="8" x2="12" y2="8" stroke="#E52525" stroke-width="1" />
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">
        Active Codebases:
      </text>
      <text x="435" y="14" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#F5F5F5">
        Multi-System Architect
      </text>
    </g>

    <!-- Item 4: Pull Requests & Reviews -->
    <g transform="translate(0, 84)">
      <circle cx="7" cy="6" r="3" fill="#FF7518" />
      <circle cx="13" cy="14" r="3" fill="#FF7518" />
      <path d="M 7 9 L 7 14 L 10 14" fill="none" stroke="#FF7518" stroke-width="1.2" />
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">
        Contribution Index:
      </text>
      <text x="435" y="14" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#FF5A1F">
        Tier A // High Frequency
      </text>
    </g>
  </g>
</svg>