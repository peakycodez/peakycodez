<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1010" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#200A0A" />
    </linearGradient>
    <radialGradient id="aiGlow" cx="10%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7518" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="850" height="110" rx="10" fill="#0C0C0C" />
  <rect width="850" height="110" rx="10" fill="url(#aiGlow)" />
  <rect x="1" y="1" width="848" height="108" rx="9" fill="none" stroke="#221010" stroke-width="1.2" />
  <line x1="20" y1="2" x2="830" y2="2" stroke="url(#aiBorder)" stroke-width="1.8" />

  <!-- Category Title Row -->
  <g transform="translate(25, 25)">
    <circle cx="5" cy="5" r="3" fill="#FF7518" />
    <text x="15" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="800" letter-spacing="2" fill="#F5F5F5">
      AI &amp; MACHINE LEARNING SYSTEMS
    </text>
    <text x="800" y="9" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="600" letter-spacing="1.5" fill="#71717A">
      TIER 03 // COGNITION
    </text>
  </g>

  <!-- Divider -->
  <line x1="25" y1="42" x2="825" y2="42" stroke="#1D0C0C" stroke-width="1" />

  <!-- Tech Badges -->
  <g transform="translate(25, 56)">
    <!-- TensorFlow.js -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <polygon points="18,10 24,14 18,24 12,14" fill="#FF6F00" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">TensorFlow.js</text>
    </g>

    <!-- Gemini API -->
    <g transform="translate(155, 0)">
      <rect width="130" height="34" rx="6" fill="#141414" stroke="#FF5A1F" stroke-width="1" />
      <polygon points="18,10 24,17 18,24 12,17" fill="#1A73E8" />
      <circle cx="18" cy="17" r="2" fill="#FFB347" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Gemini API</text>
    </g>

    <!-- Neural Model Integration -->
    <g transform="translate(295, 0)">
      <rect width="180" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="#E52525" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Neural Architectures</text>
    </g>

    <!-- Autonomous Agents -->
    <g transform="translate(485, 0)">
      <rect width="170" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="#FF7518" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Agentic Workflows</text>
    </g>

    <!-- Prompt Engineering -->
    <g transform="translate(665, 0)">
      <rect width="150" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="#FFB347" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Prompt Chains</text>
    </g>
  </g>
</svg>