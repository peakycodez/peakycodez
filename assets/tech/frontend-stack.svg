<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="100%">
  <defs>
    <linearGradient id="feBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1010" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#200A0A" />
    </linearGradient>
    <radialGradient id="feGlow" cx="10%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080808" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="850" height="110" rx="10" fill="#0C0C0C" />
  <rect width="850" height="110" rx="10" fill="url(#feGlow)" />
  <rect x="1" y="1" width="848" height="108" rx="9" fill="none" stroke="#221010" stroke-width="1.2" />
  <line x1="20" y1="2" x2="830" y2="2" stroke="url(#feBorder)" stroke-width="1.8" />

  <!-- Category Title Row -->
  <g transform="translate(25, 25)">
    <circle cx="5" cy="5" r="3" fill="#FF5A1F" />
    <text x="15" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="800" letter-spacing="2" fill="#F5F5F5">
      FRONTEND &amp; SPATIAL RUNTIMES
    </text>
    <text x="800" y="9" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="600" letter-spacing="1.5" fill="#71717A">
      TIER 01 // REACTIVE WEB
    </text>
  </g>

  <!-- Divider -->
  <line x1="25" y1="42" x2="825" y2="42" stroke="#1D0C0C" stroke-width="1" />

  <!-- Tech Badges -->
  <g transform="translate(25, 56)">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect width="90" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="none" stroke="#61DAFB" stroke-width="1.5" />
      <circle cx="18" cy="17" r="2.5" fill="#61DAFB" />
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">React</text>
    </g>

    <!-- Next.js -->
    <g transform="translate(100, 0)">
      <rect width="96" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="#000000" stroke="#FFFFFF" stroke-width="1.2" />
      <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">N</text>
      <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Next.js</text>
    </g>

    <!-- Vite -->
    <g transform="translate(206, 0)">
      <rect width="80" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <polygon points="18,10 24,14 17,24 20,24 14,26" fill="#BD34FE" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Vite</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(296, 0)">
      <rect width="115" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <rect x="10" y="9" width="16" height="16" rx="2" fill="#3178C6" />
      <text x="13" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">TS</text>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">TypeScript</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(421, 0)">
      <rect width="110" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <rect x="10" y="9" width="16" height="16" rx="2" fill="#F7DF1E" />
      <text x="13" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#000000">JS</text>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">JavaScript</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(541, 0)">
      <rect width="124" height="34" rx="6" fill="#141414" stroke="#2B1212" stroke-width="1" />
      <circle cx="18" cy="17" r="7" fill="#06B6D4" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F5F5F5">Tailwind CSS</text>
    </g>

    <!-- Three.js -->
    <g transform="translate(675, 0)">
      <rect width="125" height="34" rx="6" fill="#141414" stroke="#FF5A1F" stroke-width="1" />
      <polygon points="18,10 24,24 12,24" fill="none" stroke="#FF5A1F" stroke-width="1.5" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#FF5A1F">Three.js 3D</text>
    </g>
  </g>
</svg>