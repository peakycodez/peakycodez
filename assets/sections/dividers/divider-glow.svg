<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30">
  <defs>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="30%" stop-color="#3A1010" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="70%" stop-color="#3A1010" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>

    <filter id="emberPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Grid Line -->
  <line x1="80" y1="15" x2="920" y2="15" stroke="#1F0B0B" stroke-width="1.2" />

  <!-- Animated Traveling Molten Beam -->
  <line x1="80" y1="15" x2="920" y2="15" stroke="url(#glowLine)" stroke-width="2" filter="url(#emberPulse)">
    <animate attributeName="stroke-dasharray" values="50,900;900,50;50,900" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Center Hex Node -->
  <g transform="translate(500, 15)">
    <polygon points="0,-6 10,0 0,6 -10,0" fill="#0C0404" stroke="#FF5A1F" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#FFB347">
      <animate attributeName="r" values="2;3.5;2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>